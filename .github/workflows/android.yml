# Baut bei jeder Änderung am Spiel die Android-App und stellt sie unter "Releases" bereit.
# Die eigentlichen Schritte stehen in tools/build-android.sh.
name: Android-App bauen

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "rechtliches.html"
      - "manifest.webmanifest"
      - "css/**"
      - "js/**"
      - "icons/**"
      - "assets/**"
      - "package.json"
      - "capacitor.config.json"
      - "tools/build-android.sh"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: App bauen, signieren, veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -o pipefail
          bash tools/build-android.sh 2>&1 | tee build.log
      - name: Protokoll sichern
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
        run: bash tools/push-log.sh
