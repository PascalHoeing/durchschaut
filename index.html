<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f4ef">
<title>Durchschaut – Prototyp</title>
<style>
:root{
  --bg:#f5f4ef;--surface:#ffffff;--ink:#1f2528;--muted:#616c70;--line:#e4e1d8;
  --accent:#2f6b5f;--accent-ink:#ffffff;--accent-soft:#e3eee9;
  --warn:#a5532c;--warn-soft:#f6e7de;--radius:18px;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#131716;--surface:#1c2220;--ink:#e7ebe9;--muted:#9ba6a2;--line:#2b3330;
  --accent:#73b8a6;--accent-ink:#0e1412;--accent-soft:#20322d;--warn:#e29b78;--warn-soft:#382821;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:480px;margin:0 auto;padding:16px 20px 56px}
.stack>*+*{margin-top:20px}
.stack-sm>*+*{margin-top:12px}
h1{font-size:30px;line-height:1.15;margin:0;letter-spacing:-.02em}
h2{font-size:23px;line-height:1.25;margin:0;letter-spacing:-.01em}
h3{font-size:16px;margin:0}
p{margin:0}
.lead{font-size:18px;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:14px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.soft{background:var(--accent-soft);border-color:transparent}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:16px 18px;font-weight:600;
  background:var(--accent);color:var(--accent-ink);text-align:center;transition:transform .1s, opacity .2s}
.btn:active{transform:scale(.985)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.link{background:none;border:0;color:var(--muted);font-weight:500;padding:8px;font-size:14px;text-decoration:underline}
.row{display:flex;gap:12px;align-items:center}
.between{justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;
  background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:600}

/* Top bar */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 14px;margin:-16px 0 8px}
.back{border:0;background:none;padding:6px 0;color:var(--muted);font-size:15px}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .35s ease}

/* Persona */
.persona{display:flex;align-items:center;gap:10px}
.avatar{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;
  font-weight:700;font-size:14px;color:#fff;background:#3d5a80}
.followers{font-variant-numeric:tabular-nums}
.delta{color:var(--accent);font-weight:700;margin-left:4px;animation:pop .9s ease}
@keyframes pop{0%{opacity:0;transform:translateY(6px)}30%{opacity:1;transform:none}}

/* Options */
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);
  border-radius:14px;padding:16px;transition:border-color .2s, opacity .2s}
.opt:hover{border-color:var(--accent)}
.opt[disabled]{cursor:default}
.opt[disabled]:not(.chosen){opacity:.5}
.opt.chosen{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.opt .scene{margin-bottom:10px}
.fb{border-radius:14px;padding:16px;background:var(--accent-soft)}
.fb.bad{background:var(--warn-soft)}
.fb strong{display:block;margin-bottom:4px}
.fb.bad strong{color:var(--warn)}
.fb.good strong{color:var(--accent)}

/* Post */
.post{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 16px 12px}
.post .head{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.post .name{font-weight:700;font-size:15px;line-height:1.2}
.post .handle{color:var(--muted);font-size:13px}
.post .text{font-size:16px;white-space:pre-line}
.post .scene{margin-top:12px}
.post .stats{display:flex;gap:22px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);
  color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.post .stats span{display:inline-flex;align-items:center;gap:5px}
.scene svg{display:block;width:100%;height:auto;border-radius:12px}
.cap{font-size:12px;color:var(--muted);margin-top:6px;font-style:italic}

/* Lists */
ul.clean{margin:0;padding:0;list-style:none}
ul.clean li{position:relative;padding-left:22px}
ul.clean li+li{margin-top:10px}
ul.clean li::before{content:"";position:absolute;left:4px;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.steps{counter-reset:s;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;display:flex;gap:14px}
.steps li+li{margin-top:14px}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:14px}

/* Round list */
.round{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.round .num{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;
  font-size:15px;background:var(--bg);border:1px solid var(--line)}
.round.done .num{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.round .t{font-weight:600;line-height:1.3}
.round .s{font-size:14px;color:var(--muted)}
.round .meta{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}

.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid-opts .choice{font-size:14px;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:anywhere}
.choice{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 10px;font-weight:600;font-size:15px;line-height:1.25}
.choice[disabled]{cursor:default;opacity:.55}
.choice.right{opacity:1;border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.choice.wrong{opacity:1;border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.big{font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1}
.q{border-left:3px solid var(--accent);padding-left:14px;font-weight:600}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.foot{font-size:13px;color:var(--muted);text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"></main>

const KEY = "fni-progress-v1";
let progress = {done:{}, followers:0, finalBest:null};
try { const raw = localStorage.getItem(KEY); if (raw) progress = Object.assign(progress, JSON.parse(raw)); } catch(e){}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(progress)); } catch(e){} }

let S = {view:"home"};
let lastDelta = 0;
let confirmReset = false;

const fmt = n => n.toLocaleString("de-DE");
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* =========================================================
   Bausteine
   ========================================================= */
function post(p, opts={}){
  const initials = p.author.split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();
  const img = p.img ? `<div class="scene">${scene(p.img)}${p.imgcap?`<div class="cap">${esc(p.imgcap)}</div>`:""}</div>` : "";
  const st = opts.stats || {c: 12, s: 8, l: 41};
  return `<article class="post">
    <div class="head"><div class="avatar" style="background:${p.color||"#3d5a80"}">${esc(initials)}</div>
      <div><div class="name">${esc(p.author)}</div><div class="handle">${esc(p.handle)} · ${esc(p.date || opts.when || "vor 2 Std.")}</div></div></div>
    ${p.text?`<div class="text">${esc(p.text)}</div>`:""}
    ${img}
    <div class="stats">
      <span>${icon("c")} ${fmt(st.c)}</span><span>${icon("s")} ${fmt(st.s)}</span><span>${icon("l")} ${fmt(st.l)}</span>
    </div></article>`;
}
function icon(t){
  const p = {
    c:'<path d="M4 5h16v11H8l-4 4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
    s:'<path d="M7 7h11l-3-3M17 17H6l3 3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>',
    l:'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>'
  }[t];
  return `<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;
}
function topbar(label, pct, showPersona){
  const d = lastDelta ? `<span class="delta">+${fmt(lastDelta)}</span>` : "";
  lastDelta = 0;
  return `<div class="top">
    <div class="row between">
      <button class="back" data-a="home" aria-label="Zur Übersicht">← Übersicht</button>
      ${showPersona ? `<span class="pill"><span class="followers">${fmt(progress.followers)}</span> Follower${d}</span>` : `<span class="small muted">${esc(label)}</span>`}
    </div>
    <div class="bar"><i style="width:${pct}%"></i></div>
  </div>`;
}
function persona(){
  return `<div class="persona"><div class="avatar" style="background:#c0563b">LA</div>
    <div><div style="font-weight:700;line-height:1.2">Lindenhain Aktuell</div><div class="small muted">Dein Account · @lindenhain_aktuell</div></div></div>`;
}

        </button>`;}).join("")}
      <button class="round" data-a="final">

const PHASES = ["intro","step0","step1","post","explain","test"];
function pctFor(){
  const key = S.phase==="step" ? "step"+S.step : S.phase;
  let i = PHASES.indexOf(key); if (S.phase==="test") i += S.t/3;
  if (S.phase==="result") return 100;
  return Math.round(((i+1)/(PHASES.length+1))*100);
}

function vRound(){
  const r = ROUNDS[S.r];
  const eyebrow = `<div class="eyebrow">Runde ${S.r+1} · ${esc(r.title)}</div>`;
  const tb = topbar("", pctFor(), true);

  if (S.phase==="intro") return tb + `<div class="stack fade">
      ${eyebrow}
      ${persona()}
      <section class="card stack-sm"><h3>Die Lage</h3><p>${esc(r.lage)}</p></section>
      <section class="card soft stack-sm"><h3>Dein Auftrag</h3><p>${esc(r.auftrag)}</p></section>
      <button class="btn" data-a="next">Auftrag annehmen</button>
    </div>`;

  if (S.phase==="step"){
    const st = r.steps[S.step];
    const picked = S.picked;
    const opts = st.opts.map((o,i)=>{
      const pic = o.img!==undefined ? (o.img ? `<div class="scene">${scene(o.img)}</div>` : "") : "";
      const label = o.img!==undefined ? `<span class="small">${esc(o.imgcap)}</span>` : esc(o.text);
      return `<button class="opt ${picked===i?"chosen":""}" data-a="pick" data-v="${i}" ${picked!=null?"disabled":""}>${pic}${label}</button>`;
    }).join("");
    let fb = "";
    if (picked!=null){
      const o = st.opts[picked];
      fb = `<div class="fb ${o.best?"good":""} fade" role="status"><strong>+${fmt(o.reach)} Follower</strong>${esc(o.fb)}
        ${o.best?"":`<p class="small muted" style="margin-top:8px">Eine andere Variante hätte dir mehr Reichweite gebracht.</p>`}</div>
        <button class="btn" data-a="next">Weiter</button>`;
    }
    return tb + `<div class="stack fade">
      ${eyebrow}
      <div class="stack-sm"><p class="small muted">Schritt ${S.step+1} von ${r.steps.length} · ${esc(r.auftrag)}</p><h2>${esc(st.q)}</h2></div>
      <div class="stack-sm">${opts}</div>
      ${fb}
    </div>`;
  }

  if (S.phase==="post"){
    const chosen = S.picks.map((p,i)=>r.steps[i].opts[p]);
    const text = chosen.map(o=>o.text).filter(Boolean).join("\n\n");
    const imgOpt = chosen.find(o=>o.img);
    const reach = chosen.reduce((a,o)=>a+o.reach,0);
    const allBest = chosen.every(o=>o.best);
    const p = {author:"Lindenhain Aktuell", handle:"@lindenhain_aktuell", color:"#c0563b", text, img: imgOpt?imgOpt.img:null};
    const stats = {c: Math.round(reach*0.4)+3, s: Math.round(reach*0.9)+2, l: Math.round(reach*2.6)+9};
    return tb + `<div class="stack fade">
      ${eyebrow}
      <h2>Dein Beitrag ist online.</h2>
      ${post(p,{stats, when:"gerade eben"})}
      <div class="card stack-sm">
        <div class="row between"><span class="muted">Neue Follower in dieser Runde</span><strong>+${fmt(reach)}</strong></div>
        <p class="small muted">${allBest
          ? "Du hast die Technik voll ausgereizt. Genau deshalb ist sie so verbreitet: Sie funktioniert."
          : "Die manipulativsten Varianten hätten dir am meisten Reichweite gebracht. Plattformen belohnen Aufregung – nicht Genauigkeit."}</p>
      </div>
      <button class="btn" data-a="next">Was steckt dahinter?</button>
    </div>`;
  }

  if (S.phase==="explain"){
    const e = r.explain;
    return tb + `<div class="stack fade">
      <div class="eyebrow">Die Technik</div>
      <h2>${esc(r.title)}</h2>
      <p>${esc(e.what)}</p>
      <section class="card stack-sm"><h3>Warum es wirkt</h3><p class="muted">${esc(e.why)}</p></section>
      <section class="card stack-sm"><h3>So erkennst du es</h3><ul class="clean">${e.signs.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></section>
      <section class="card soft stack-sm"><h3>Deine Gegenfrage</h3><p class="q">${esc(e.question)}</p>
        ${e.tip?`<p class="small muted">${esc(e.tip)}</p>`:""}</section>
      <button class="btn" data-a="next">Zum Mini-Test</button>
    </div>`;
  }

  if (S.phase==="test"){
    const it = r.test[S.t];
    const a = S.tAns;
    const btn = (v,label)=>{
      let cls = "";
      if (a!=null){ if (v===it.verdict) cls="right"; else if (v===a) cls="wrong"; }
      return `<button class="choice ${cls}" data-a="answer" data-v="${v}" ${a!=null?"disabled":""}>${label}</button>`;
    };
    let fb = "";
    if (a!=null){
      const ok = a===it.verdict;
      fb = `<div class="fb ${ok?"good":"bad"} fade" role="status"><strong>${ok?"Richtig erkannt.":"Nicht ganz."}</strong>${esc(it.exp)}</div>
        <button class="btn" data-a="next">${S.t<2?"Nächstes Beispiel":"Runde abschließen"}</button>`;
    }
    return tb + `<div class="stack fade">
      <div class="eyebrow">Mini-Test · ${S.t+1} von 3</div>
      <h2>Seriös oder manipulativ?</h2>
      ${post(it)}
      <div class="two">${btn("serios","Eher seriös")}${btn("manip","Manipulativ")}</div>
      ${fb}
    </div>`;
  }

  if (S.phase==="result"){
    const nextIdx = ROUNDS.findIndex((x,i)=>i>S.r && progress.done[x.id]==null);
    const anyOpen = ROUNDS.findIndex(x=>progress.done[x.id]==null);
    const ni = nextIdx>=0 ? nextIdx : anyOpen;
    const nextBtn = ni>=0
      ? `<button class="btn" data-a="start" data-v="${ni}">Nächste Runde: ${esc(ROUNDS[ni].title)}</button>`
      : `<button class="btn" data-a="final">Zum Abschlusstest</button>`;
    const msg = S.tScore===3 ? "Stark – alle Beispiele richtig eingeordnet." : S.tScore===2 ? "Gut gemacht. Ein Beispiel war knifflig." : "Kein Problem – genau dafür ist das Training da.";
    return tb + `<div class="stack fade">
      <div class="eyebrow">Runde ${S.r+1} geschafft</div>
      <div class="card stack-sm" style="text-align:center">
        <div class="big">${S.tScore}/3</div><p class="muted">${msg}</p>
      </div>
      <section class="card soft stack-sm"><h3>Merk dir für „${esc(r.title)}“</h3><p class="q">${esc(r.explain.question)}</p></section>
      ${nextBtn}
      <button class="btn ghost" data-a="home">Zur Übersicht</button>
    </div>`;
  }
}

function vFinal(){
  if (S.i >= S.order.length){
    const n = S.order.length;
    return topbar("Abschlusstest",100,false) + `<div class="stack fade">
      <div class="eyebrow">Abschlusstest geschafft</div>
      <div class="card stack-sm" style="text-align:center"><div class="big">${S.score}/${n}</div>
        <p class="muted">${S.score===n?"Alle Techniken sicher erkannt.":S.score>=n-2?"Sehr ordentlich. Du hast den Blick dafür.":"Ein guter Anfang. Eine Runde mehr schärft den Blick."}</p></div>
      <section class="card stack-sm"><h3>Fünf Fragen für den Alltag</h3>
        <ul class="clean">${ROUNDS.map(r=>`<li><b>${esc(r.title)}:</b> ${esc(r.explain.question)}</li>`).join("")}</ul></section>
      <section class="card soft stack-sm"><h3>Auffrischen</h3><p class="muted">Die Wirkung lässt mit der Zeit nach. Spiel in ein paar Wochen noch eine Runde – das frischt sie auf.</p></section>
      <button class="btn" data-a="home">Zur Übersicht</button>
    </div>`;
  }
  const it = FINAL[S.order[S.i]];
  const a = S.ans;
  const keys = ["emotion","experten","kontext","verschwoerung","polarisierung","keine"];
  const btns = keys.map(k=>{
    let cls=""; if (a!=null){ if (k===it.answer) cls="right"; else if (k===a) cls="wrong"; }
    return `<button class="choice ${cls}" data-a="fanswer" data-v="${k}" ${a!=null?"disabled":""}>${esc(TECH[k])}</button>`;
  }).join("");
  let fb="";
  if (a!=null){
    const ok = a===it.answer;
    fb = `<div class="fb ${ok?"good":"bad"} fade" role="status"><strong>${ok?"Richtig: ":"Gesucht war: "}${esc(TECH[it.answer])}</strong>${esc(it.exp)}</div>
      <button class="btn" data-a="fnext">${S.i<S.order.length-1?"Nächstes Beispiel":"Ergebnis ansehen"}</button>`;
  }
  return topbar(`${S.i+1} von ${S.order.length}`, Math.round((S.i/S.order.length)*100), false) + `<div class="stack fade">
    <div class="eyebrow">Abschlusstest · ${S.i+1} von ${S.order.length}</div>
    <h2>Welche Technik steckt dahinter?</h2>
    ${post(it)}
    <div class="grid-opts">${btns}</div>
    ${fb}
  </div>`;
}

function render(scrollTop=true){
  const app = document.getElementById("app");
  app.innerHTML = S.view==="home" ? vHome() : S.view==="round" ? vRound() : vFinal();
  if (scrollTop) window.scrollTo({top:0});
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

const actions = {
  home(){ S={view:"home"}; confirmReset=false; render(); },
  start(v){ S={view:"round", r:+v, phase:"intro", step:0, picks:[], picked:null, t:0, tAns:null, tScore:0}; render(); },
  pick(v){
    if (S.picked!=null) return;
    S.picked=+v;
    const o = ROUNDS[S.r].steps[S.step].opts[S.picked];
    progress.followers += o.reach; lastDelta = o.reach; save();
    render(false);
    const fb = document.querySelector(".fb"); if (fb) fb.scrollIntoView({behavior:"smooth", block:"center"});
  },
  answer(v){
    if (S.tAns!=null) return;
    S.tAns=v; if (v===ROUNDS[S.r].test[S.t].verdict) S.tScore++;
    render(false);
    const fb = document.querySelector(".fb"); if (fb) fb.scrollIntoView({behavior:"smooth", block:"center"});
  },
  next(){
    const r = ROUNDS[S.r];
    if (S.phase==="intro"){ S.phase="step"; S.step=0; }
    else if (S.phase==="step"){
      if (S.picked==null) return;
      S.picks.push(S.picked); S.picked=null; S.step++;
      if (S.step>=r.steps.length) S.phase="post";
    }
    else if (S.phase==="post") S.phase="explain";
    else if (S.phase==="explain"){ S.phase="test"; S.t=0; S.tAns=null; }
    else if (S.phase==="test"){
      if (S.tAns==null) return;
      S.t++; S.tAns=null;
      if (S.t>=r.test.length){
        S.phase="result";
        const prev = progress.done[r.id];
        progress.done[r.id] = prev==null ? S.tScore : Math.max(prev, S.tScore);
        save();
      }
    }
    render();
  },
  final(){ S={view:"final", i:0, ans:null, score:0, order:shuffle(FINAL.map((_,i)=>i))}; render(); },
  fanswer(v){
    if (S.ans!=null) return;
    S.ans=v; if (v===FINAL[S.order[S.i]].answer) S.score++;
    render(false);
    const fb = document.querySelector(".fb"); if (fb) fb.scrollIntoView({behavior:"smooth", block:"center"});
  },
  fnext(){
    S.i++; S.ans=null;
    if (S.i>=S.order.length){
      progress.finalBest = progress.finalBest==null ? S.score : Math.max(progress.finalBest, S.score); save();
    }
    render();
  },
  reset(){
    if (!confirmReset){ confirmReset=true; render(false); return; }
    progress={done:{}, followers:0, finalBest:null}; save(); confirmReset=false; render();
  }
};

document.addEventListener("click", e=>{
  const b = e.target.closest("[data-a]");
  if (!b || b.disabled) return;
  const fn = actions[b.dataset.a];
  if (fn) fn(b.dataset.v);
});

render();
</script>
</body>
</html>
